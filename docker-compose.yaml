services:
  db:
    image: postgres:16-alpine
    container_name: agroskalka-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agroskalka}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-agroskalka}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: agroskalka-keycloak
    command: start-dev --import-realm
    environment:
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_TEST_ADMIN_USERNAME: ${KC_TEST_ADMIN_USERNAME}
      KC_TEST_ADMIN_PASSWORD: ${KC_TEST_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./agroskalka-realm.json:/opt/keycloak/data/import/agroskalka-realm.json:ro

  mailpit:
    image: axllent/mailpit:latest
    container_name: agroskalka-mailpit
    ports:
      - "8025:8025" # Panel WWW ze skrzynką odbiorczą
      - "1025:1025" # Port SMTP

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: agroskalka-stripe
    command: listen --api-key ${STRIPE_SECRET_KEY} --forward-to https://host.docker.internal:7251/api/webhooks/stripe --skip-verify --all-snapshot
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  keycloak_data:
  postgres_data: